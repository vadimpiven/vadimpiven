# Tooling and tasks for the CV.
#   mise trust
#   mise install      → fetch Typst
#   mise run build    → compile the PDF once
#   mise run watch    → rebuild on every change

[tools]
"github:typst/typst" = "0.15.0"
pandoc = "3.10"
"npm:markdownlint-cli" = "0.49.0"

[env]
# Let Typst (and any manual `typst` call in this dir) find the bundled fonts.
TYPST_FONT_PATHS = "{{config_root}}/fonts"

[tasks.compile]
description = "Compile to PDF"
alias = "c"
run = "typst compile --ignore-system-fonts 'Vadim_Piven_CV.typ'"
sources = ["**/*.typ", "fonts/**"]

[tasks.readme]
description = "Generate README.md from the CV source (Typst → HTML → Markdown)"
alias = "r"
depends = ["compile"]
# Typst HTML export keeps the headings/links the PDF loses; pandoc turns it into Markdown.
# -raw_html drops Typst's <span> underline wrappers and keeps <br> as `\` hard breaks.
run = [
  "typst compile --ignore-system-fonts --format html --features html 'Vadim_Piven_CV.typ' '{{config_root}}/.cv.html'",
  "pandoc -f html -t gfm-raw_html '{{config_root}}/.cv.html' -o 'README.md'",
  "rm -f '{{config_root}}/.cv.html'",
  "markdownlint --fix 'README.md'",
]
sources = ["**/*.typ", "fonts/**"]
outputs = ["README.md"]

[tasks.watch]
description = "Recompile PDF on every change"
alias = "w"
run = "typst watch --ignore-system-fonts 'Vadim_Piven_CV.typ'"
