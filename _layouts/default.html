<!doctype html>
<html
  lang="en"
  prefix="og: https://ogp.me/ns#"
>
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    
    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Vadim Piven - Software engineer working with Rust and C++. Developing domain-specific database at MiLaboratories. Open source contributor with experience at Kaspersky and Movavi."
    >
    <meta
      name="keywords"
      content="Vadim Piven, Rust Developer, C++ Developer, System Programming, Software Engineer"
    >
    <meta
      name="author"
      content="Vadim Piven"
    >
    <meta
      name="robots"
      content="index, follow"
    >
    <link
      rel="canonical"
      href="https://piven.tech{% if page.url != '/' %}{{ page.url }}{% endif %}"
    >
    
    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="Vadim Piven - Software Engineer"
    >
    <meta
      property="og:description"
      content="Software engineer working with Rust and C++. Developing domain-specific database at MiLaboratories. Open source contributor."
    >
    <meta
      property="og:type"
      content="website"
    >
    <meta
      property="og:url"
      content="https://piven.tech/"
    >
    <meta
      property="og:site_name"
      content="Piven.TECH"
    >
    <meta
      property="og:locale"
      content="en_US"
    >
    
    <!-- Twitter Card Meta Tags -->
    <meta
      name="twitter:card"
      content="summary"
    >
    <meta
      name="twitter:title"
      content="Vadim Piven - Software Engineer"
    >
    <meta
      name="twitter:description"
      content="Software engineer working with Rust and C++. Developing domain-specific database at MiLaboratories. Open source contributor."
    >
    
    <!-- Professional Schema.org structured data -->
    <script
      type="application/ld+json"
    >
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Vadim Piven",
      "jobTitle": "Software Engineer",
      "description": "Software engineer working with Rust and C++, developing domain-specific database and contributing to open source",
      "url": "https://piven.tech/",
      "sameAs": [
        "https://www.linkedin.com/in/vadimpiven/",
        "https://github.com/vadimpiven/",
        "https://leetcode.com/vadimpiven/",
        "https://t.me/vadimpiven"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "MiLaboratories"
      },
      "alumniOf": [
        {
          "@type": "EducationalOrganization",
          "name": "Higher School of Economics",
          "description": "Master's Degree in System and Software Engineering"
        },
        {
          "@type": "EducationalOrganization", 
          "name": "MIREA - Russian Technological University",
          "description": "Bachelor's Degree in Applied Mathematics and Informatics"
        }
      ],
      "knowsAbout": [
        "Rust Programming",
        "C++ Development", 
        "System Programming",
        "Cross-platform Development",
        "Desktop Product Development",
        "Open Source Development",
        "Software Engineering"
      ]
    }
    </script>
    
    <meta
      http-equiv='cache-control'
      content='no-cache'
    > 
    <meta
      http-equiv='expires'
      content='0'
    > 
    <meta
      http-equiv='pragma'
      content='no-cache'
    >

    <link
      rel="apple-touch-icon"
      sizes="57x57"
      href="/assets/common/apple-icon-57x57.png"
    >
    <link
      rel="apple-touch-icon"
      sizes="60x60"
      href="/assets/common/apple-icon-60x60.png"
    >
    <link
      rel="apple-touch-icon"
      sizes="72x72"
      href="/assets/common/apple-icon-72x72.png"
    >
    <link
      rel="apple-touch-icon"
      sizes="76x76"
      href="/assets/common/apple-icon-76x76.png"
    >
    <link rel="apple-touch-icon" sizes="114x114" href="/assets/common/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/assets/common/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/assets/common/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/common/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/common/apple-icon-180x180.png">
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/common/android-icon-192x192.png"
    >
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/common/favicon-32x32.png"
    >
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/assets/common/favicon-96x96.png"
    >
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/common/favicon-16x16.png"
    >
    <link rel="manifest" href="/assets/common/manifest.json">
    <meta
      name="msapplication-TileColor"
      content="#ffffff"
    >
    <meta
      name="msapplication-TileImage"
      content="/assets/common/ms-icon-144x144.png"
    >
    <meta
      name="theme-color"
      content="#ffffff"
    >
    
    <title>{% if page.title == 'Home' %}Vadim Piven - Software Engineer | Rust & C++ Developer{% else %}{{ page.title }} - Vadim Piven | Piven.TECH{% endif %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link
      rel="preconnect"
      href="https://cdn.jsdelivr.net"
    >
    
    <!-- Custom styles -->
    <link
      rel="stylesheet"
      href="{{ '/assets/css/custom.css' | relative_url }}"
    >
  </head>

  <body>
    <header
      class="container-flex bg-gradient text-light"
      style="background-color: #6610f2;"
      role="banner"
    >
      <div class="container">
        <nav
          class="row navbar navbar-expand-sm navbar-dark"
          role="navigation"
          aria-label="Main navigation"
        >
          <div class="container-fluid">
            
            <a
              class="navbar-brand"
              href="/"
              aria-label="Piven.TECH - Home"
            >
              Piven.TECH
            </a>

          </div>
        </nav>
      </div>
    </header>
    
    <main
      class="pt-3 pb-1"
      role="main"
      id="main-content"
    >
      <div class="container">{{ content }}</div>
    </main>
    
    <div class="container-flex animated-stripe"></div>
    
    <footer
      class="container text-muted py-3"
      role="contentinfo"
    >
      <div class="d-flex justify-content-between align-items-center">
        
        <span>Copyright &copy; <script>document.write(new Date().getFullYear());</script> Vadim Piven</span>
        <div class="btn-group">
          <a
            href="https://github.com/vadimpiven/vadimpiven/tree/gh-pages/{{ page.path }}"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-outline-secondary"
            aria-label="Edit this page on GitHub"
          >
            Edit
          </a>
          <a
            href="#main-content"
            class="btn btn-outline-primary"
            aria-label="Back to top of page"
          >
            Back to top
          </a>
        </div>
        
      </div>
    </footer>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    
    <script src="{{ '/assets/js/system-theme.js' | relative_url }}"></script>
  </body>
</html>
